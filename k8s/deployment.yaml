apiVersion: apps/v1
kind: Deployment

metadata:
  name: practice-api
  labels:
    app: practice-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: practice-api

  template:
    metadata:
      labels:
        app: practice-api

    spec:
      containers:
        - name: api
          image: practice-fastapi:v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"