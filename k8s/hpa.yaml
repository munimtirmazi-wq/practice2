apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: practice-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: practice-api  # This must match your deployment name
  minReplicas: 2        # Never go below this many pods
  maxReplicas: 10       # Never go above this many pods
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70 # Scale up if average CPU usage goes above 70%
