services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.multistage
    image: practice-fastapi:compose
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://practice:practice-password@db:5432/practice
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: practice
      POSTGRES_PASSWORD: practice-password
      POSTGRES_DB: practice
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practice -d practice"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data: